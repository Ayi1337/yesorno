  <style>

    button:disabled { cursor: default; opacity: .5; }
    button { border: 0; background: none; }
    button:focus-visible, a:focus-visible { outline: 2px solid currentColor; outline-offset: 5px; }
    input, textarea { outline: none; }
    svg { display: block; width: 20px; height: 20px; flex: 0 0 auto; }

    .wordmark .yes { color: var(--green); }
    .wordmark .no { color: var(--red); }
    .wordmark .or { font-size: .46em; font-weight: 700; letter-spacing: -1.5px; color: #8b908d; }
    .wordmark .question-mark { margin-left: -8px; color: #969b98; }
    .tagline { margin: 16px 0 0; font-size: 14px; line-height: 1.6; color: var(--muted); letter-spacing: .03em; }
    fieldset { min-width: 0; margin: 0; padding: 0; border: 0; }
    .question-shell { display: flex; align-items: flex-end; gap: 16px; padding: 16px; border: 1px solid var(--line); border-radius: 20px; transition: border-color .18s, box-shadow .18s; }
    .question-shell:focus-within { border-color: #9ca49e; box-shadow: 0 0 0 3px #30363208; }
    .question-shell.invalid { border-color: #cb3b45; }
    .question-input { display: block; flex: 1; min-width: 0; height: 44px; max-height: 180px; padding: 6px 5px; resize: none; border: 0; background: transparent; font-size: 20px; line-height: 32px; }
    .question-input::placeholder { color: #707770; }
    .submit-button { display: grid; place-items: center; width: 44px; height: 44px; flex: 0 0 44px; padding: 0; border-radius: 50%; color: #fff; background: var(--ink); transition: background-color .18s, transform .15s; }
    .submit-button:hover:not(:disabled) { background: #101b13; }
    .submit-button:active:not(:disabled) { transform: scale(.94); }
    .submit-button svg { width: 22px; height: 22px; }
    .extras { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 22px; margin-top: 9px; }
    .text-button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 8px 0; border-radius: 4px; font-size: 13px; line-height: 1.5; color: var(--muted); }
    .text-button:hover, .text-button[aria-expanded="true"] { color: var(--ink); }
    .text-button svg { width: 14px; height: 14px; transition: transform .18s; }
    .text-button[aria-expanded="true"] > svg { transform: rotate(45deg); }
    .context-dot { width: 4px; height: 4px; margin-left: 1px; border-radius: 50%; background: currentColor; }
    .extra-panel { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .3s cubic-bezier(.2,.7,.25,1), opacity .2s ease; }
    .extra-panel.is-open { grid-template-rows: 1fr; opacity: 1; }
    .panel-inner { min-height: 0; overflow: hidden; }
    .panel-content { padding: 13px 3px 3px; }
    .custom-hint { margin: 0 0 12px; color: var(--ink); font-size: 13px; line-height: 1.7; }
    .custom-rows { display: grid; gap: 9px; }
    .option-row { display: flex; align-items: center; gap: 8px; }
    .option-input { min-width: 0; width: 100%; padding: 13px 15px; border: 1px solid var(--line); border-radius: 12px; background: transparent; font-size: 16px; line-height: 22px; }
    .option-input:focus, .context-input:focus { border-color: #9ca49e; box-shadow: 0 0 0 3px #30363208; }
    .option-input[aria-invalid="true"] { border-color: #cb3b45; }
    .option-input::placeholder, .context-input::placeholder { color: #707770; }
    .remove-option { display: grid; place-items: center; width: 44px; height: 44px; flex: 0 0 44px; border-radius: 50%; color: var(--muted); }
    .remove-option:hover { background: #f6f7f6; color: var(--ink); }
    .remove-option svg { width: 16px; height: 16px; }
    .add-option { margin-top: 2px; }
    .context-input { display: block; width: 100%; min-height: 110px; resize: vertical; padding: 13px 15px; border: 1px solid var(--line); border-radius: 12px; background: transparent; font-size: 16px; line-height: 1.7; }
    .form-error { margin: 12px 0 0; font-size: 13px; line-height: 1.7; color: #bc303c; }
    .request-status { margin: 12px 0 0; color: var(--muted); font-size: 13px; }
    .result-note { max-width: 440px; margin: 0; font-size: 13px; line-height: 1.8; }
    .result-view { display: flex; flex-direction: column; min-height: calc(var(--viewport-height, 100dvh) - var(--footer-height)); padding: max(20px, env(safe-area-inset-top)) max(28px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(28px, env(safe-area-inset-left)); }
    .result-header { display: flex; padding-right: 140px; }
    .result-header .text-button { color: inherit; gap: 8px; }
    .result-header svg { width: 18px; height: 18px; }
    .result-stage { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 22px; width: min(100%, 1100px); margin: 0 auto; padding: 40px 0; text-align: center; }
    .result-prompt { max-width: 600px; margin: 0; font-size: 16px; font-weight: 450; line-height: 1.8; white-space: pre-wrap; overflow-wrap: anywhere; }
    .result-answer { width: 100%; max-width: 100%; margin: 0; font-family: var(--round); font-size: clamp(120px, 23vw, 300px); font-weight: 900; letter-spacing: -.045em; line-height: 1.12; text-wrap: balance; overflow-wrap: anywhere; outline: none; }
    .result-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; }
    .result-button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 11px 20px; border: 1px solid #ffffff70; border-radius: 999px; color: inherit; font-size: 14px; line-height: 22px; transition: background-color .15s; }
    .result-button:hover:not(:disabled) { background: #ffffff18; }
    .result-button svg { width: 16px; height: 16px; }
    .spin { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .noscript { padding: 16px; text-align: center; font-size: 14px; }
    .site-footer { min-height: var(--footer-height); padding: 0 20px env(safe-area-inset-bottom); text-align: center; color: var(--muted); }
    .site-footer a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; color: inherit; font-size: 11px; text-decoration: none; }
    .site-footer a:hover { text-decoration: underline; text-underline-offset: 3px; }
    body[data-view="result"] .site-footer { color: inherit; }
    @media (max-width: 560px) {
      .compose-view { padding-inline: max(20px, env(safe-area-inset-left), env(safe-area-inset-right)); }
      .brand { margin-bottom: 34px; }
      .wordmark { font-size: clamp(54px, 15vw, 72px); gap: 9px; letter-spacing: -3px; }
      .wordmark .question-mark { margin-left: -7px; }
      .tagline { margin-top: 13px; font-size: 13px; }
      .question-shell { gap: 8px; padding: 12px; border-radius: 18px; }
      .question-input { font-size: 17px; padding-left: 3px; }
      .extras { column-gap: 20px; }
      .result-stage { gap: 18px; padding-block: 36px; }
      .result-answer { font-size: clamp(112px, 36vw, 190px); }
      .result-prompt { font-size: 15px; }
      .result-button { padding-inline: 18px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
    @media (forced-colors: active) { .question-shell, .submit-button, .result-button { border: 1px solid ButtonText; } body[data-view="result"] { background: Canvas; color: CanvasText; } }

<body data-view="compose">

      <option value="zh-Hant" lang="zh-Hant">繁體中文</option>
      <option value="en" lang="en">English</option>

    <section id="compose-view" class="compose-view" aria-label="提出一个小问题" data-i18n-aria-label="composeLabel">

        <p class="tagline" data-i18n="tagline">小事，别想太久。</p>
      </header>
      <form id="decision-form" novalidate>
        <fieldset id="input-fields">
          <legend class="sr-only" data-i18n="legend">问题和选项</legend>
          <label for="question" class="sr-only" data-i18n="questionLabel">你在纠结什么？</label>
          <div class="question-shell" id="question-shell">
            <textarea id="question" name="question" class="question-input" rows="1" maxlength="400" placeholder="今天要出门吗？" aria-required="true" aria-describedby="form-error" spellcheck="false"></textarea>

          </div>
          <div class="extras">
            <button id="custom-toggle" class="text-button" type="button" aria-expanded="false" aria-controls="custom-panel"><svg fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><use href="#i-plus"/></svg><span data-i18n="customOptions">自定义选项</span></button>
            <button id="context-toggle" class="text-button" type="button" aria-expanded="false" aria-controls="context-panel"><svg fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><use href="#i-plus"/></svg><span data-i18n="addContext">补充背景</span><span id="context-dot" class="context-dot" hidden aria-hidden="true"></span><span id="context-added" class="sr-only" hidden data-i18n="addedHint">（已添加）</span></button>
          </div>
          <div id="custom-panel" class="extra-panel" inert aria-hidden="true"><div class="panel-inner"><div class="panel-content">
            <p id="custom-hint" class="custom-hint" role="status" hidden></p>
            <div id="custom-rows" class="custom-rows"></div>
            <button id="add-option" class="text-button add-option" type="button"><svg fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><use href="#i-plus"/></svg><span data-i18n="addOption">添加选项</span></button>
          </div>
          </div></div>
          <div id="context-panel" class="extra-panel" inert aria-hidden="true"><div class="panel-inner"><div class="panel-content">
            <label for="context" class="sr-only" data-i18n="contextLabel">补充背景，可选</label>

          </div></div>

      <div class="result-stage">

    </section>
